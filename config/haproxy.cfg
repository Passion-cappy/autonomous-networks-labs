global
  log stdout format raw local0
  nbthread 1
defaults
  mode http
  log global
  timeout connect 2s
  timeout client 5s
  timeout server 5s
resolvers docker_dns
  nameserver dns 127.0.0.11:53
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
frontend public
  bind :8080
  default_backend application
backend application
  option httpchk HEAD /health
  server primary backend-a:8000 check inter 1s fall 2 rise 2 resolvers docker_dns init-addr libc,none
  server reserve backend-b:8000 check inter 1s fall 2 rise 2 resolvers docker_dns init-addr libc,none backup
